            mouseX;


        let glowY =
            mouseY;


        let lastParticleTime =
            0;


        let cursorMoving =
            false;


        /* Track mouse */

        document.addEventListener(
            "mousemove",
            function(event) {

                mouseX =
                    event.clientX;

                mouseY =
                    event.clientY;


                cursorDot.style.left =
                    mouseX +
                    "px";


                cursorDot.style.top =
                    mouseY +
                    "px";


                cursorMoving =
                    true;


                const now =
                    Date.now();


                /*
                    Create a tiny trail
                    every few milliseconds.
                */

                if (
                    now -
                    lastParticleTime >
                    45
                ) {

                    createCursorParticle(
                        mouseX,
                        mouseY
                    );


                    lastParticleTime =
                        now;

                }

            }
        );


        /* Smooth cursor animation */

        function animateCursor() {

            glowX +=
                (
                    mouseX -
                    glowX
                ) * 0.16;


            glowY +=
                (
                    mouseY -
                    glowY
                ) * 0.16;


            cursorGlow.style.left =
                glowX +
                "px";


            cursorGlow.style.top =
                glowY +
                "px";


            requestAnimationFrame(
                animateCursor
            );

        }


        animateCursor();


        /* =========================================================
           CURSOR TRAIL PARTICLE
        ========================================================= */

        function createCursorParticle(
            x,
            y
        ) {

            const particle =
                document.createElement(
                    "div"
                );


            particle.className =
                "cursor-particle";


            particle.style.left =
                x +
                "px";


            particle.style.top =
                y +
                "px";


            const size =
                2 +
                Math.random() *
                4;


            particle.style.width =
                size +
                "px";


            particle.style.height =
                size +
                "px";


            document.body.appendChild(
                particle
            );


            setTimeout(
                () => {

                    particle.remove();

                },
                850
            );

        }


        /* =========================================================
           CURSOR PETALS
        ========================================================= */

        function createCursorPetal(
            x,
            y
        ) {

            const petal =
                document.createElement(
                    "div"
                );


            petal.className =
                "cursor-petal";


            const types = [
                "✿",
                "❀",
                "🌸"
            ];


            petal.textContent =
                types[
                    Math.floor(
                        Math.random() *
                        types.length
                    )
                ];


            petal.style.left =
                x +
                "px";


            petal.style.top =
                y +
                "px";


            petal.style.setProperty(
                "--move-x",
                (
                    Math.random() * 35 -
                    17
                ) +
                "px"
            );


            petal.style.setProperty(
                "--move-y",
                (
                    Math.random() * 35 -
                    17
                ) +
                "px"
            );


            petal.style.setProperty(
                "--rotation",
                (
                    Math.random() * 240 -
                    120
                ) +
                "deg"
            );


            document.body.appendChild(
                petal
            );


            setTimeout(
                () => {

                    petal.remove();

                },
                1100
            );

        }


        /* =========================================================
           CREATE CURSOR PETALS OCCASIONALLY
        ========================================================= */

        let cursorPetalCounter =
            0;


        document.addEventListener(
            "mousemove",
            function(event) {

                cursorPetalCounter++;


                /*
                    Every few mouse movements
                    create a tiny flower/petal.
                */

                if (
                    cursorPetalCounter %
                    12 ===
                    0
                ) {

                    createCursorPetal(
                        event.clientX,
                        event.clientY
                    );

                }

            }
        );


        /* =========================================================
           CURSOR HOVER EFFECT
        ========================================================= */

        function enableCursorHover() {

            cursorGlow.classList.add(
                "cursor-hover"
            );

        }


        function disableCursorHover() {

            cursorGlow.classList.remove(
                "cursor-hover"
            );

        }


        /*
            Interactive elements.
        */

        document.addEventListener(
            "mouseover",
            function(event) {

                const interactive =
                    event.target.closest(
                        "button, .poem-card, .made-by, .footer-name, input"
                    );


                if (interactive) {

                    enableCursorHover();

                }

            }
        );


        document.addEventListener(
            "mouseout",
            function(event) {

                const interactive =
                    event.target.closest(
                        "button, .poem-card, .made-by, .footer-name, input"
                    );


                if (
                    interactive &&
                    !interactive.contains(
                        event.relatedTarget
                    )
                ) {

                    disableCursorHover();

                }

            }
        );


        /* =========================================================
           CURSOR CLICK ANIMATION
        ========================================================= */

        document.addEventListener(
            "mousedown",
            function() {

                cursorGlow.classList.add(
                    "cursor-click"
                );

            }
        );


        document.addEventListener(
            "mouseup",
            function() {

                cursorGlow.classList.remove(
                    "cursor-click"
                );

            }
        );


        /* =========================================================
           HOME MOUSE PARALLAX
        ========================================================= */

        document.addEventListener(
            "mousemove",
            function(event) {

                const intro =
                    document.getElementById(
                        "intro"
                    );


                if (
                    intro.style.display ===
                    "none"
                ) {

                    return;

                }


                const x =
                    (
                        event.clientX /
                        window.innerWidth
                    ) - 0.5;


                const y =
                    (
                        event.clientY /
                        window.innerHeight
                    ) - 0.5;


                const orbs =
                    document.querySelectorAll(
                        ".home-orb"
                    );


                orbs.forEach(
                    (orb, index) => {

                        const strength =
                            (
                                index + 1
                            ) * 12;


                        orb.style.transform =
                            `translate(
                                ${x * strength}px,
                                ${y * strength}px
                            )`;

                    }
                );

            }
        );


        /* =========================================================
           SCROLL PARALLAX
        ========================================================= */

        window.addEventListener(
            "scroll",
            function() {

                const roses =
                    document.querySelectorAll(
                        ".home-rose"
                    );


                roses.forEach(
                    (rose, index) => {

                        const speed =
                            (
                                index % 3 +
                                1
                            ) * 0.08;


                        rose.style.transform =
                            `translateY(
                                ${window.scrollY * speed}px
                            )`;

                    }
                );

            }
        );


        /* =========================================================
           INITIALIZE
        ========================================================= */

        displayPoems();

    </script>

</body>

</html>

        /* =========================================================
           VARIABLES
        ========================================================= */

        let currentPoem = 0;

        let lineTimers = [];


        /* =========================================================
           ENTER GARDEN
        ========================================================= */

        function enterGarden() {

            createClickPetals(
                window.innerWidth / 2,
                window.innerHeight / 2,
                16
            );


            const intro =
                document.getElementById(
                    "intro"
                );


            intro.style.opacity = "0";

            intro.style.transform =
                "scale(1.08)";


            setTimeout(() => {

                intro.style.display =
                    "none";


                const main =
                    document.getElementById(
                        "main-site"
                    );


                main.style.display =
                    "block";


                window.scrollTo(
                    0,
                    0
                );

            }, 1000);
        }


        /* =========================================================
           DISPLAY POEMS
        ========================================================= */

        function displayPoems(
            list = poems
        ) {

            const grid =
                document.getElementById(
                    "poem-grid"
                );


            grid.innerHTML = "";


            if (
                list.length === 0
            ) {

                grid.innerHTML = `
                    <div style="
                        grid-column:1/-1;
                        text-align:center;
                        padding:70px 20px;
                        color:rgba(255,210,225,0.6);
                        font-size:20px;
                    ">
                        No whispers found... 🌙
                    </div>
                `;

                return;
            }


            list.forEach(
                poem => {

                    const originalIndex =
                        poems.indexOf(
                            poem
                        );


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "poem-card";


                    card.innerHTML = `
                        <div class="poem-title">
                            ${poem.title}
                        </div>
                    `;


                    card.addEventListener(
                        "click",
                        function(event) {

                            createClickPetals(
                                event.clientX,
                                event.clientY,
                                10
                            );


                            openPoem(
                                originalIndex
                            );

                        }
                    );


                    grid.appendChild(
                        card
                    );

                }
            );
        }


        /* =========================================================
           OPEN POEM
        ========================================================= */

        function openPoem(index) {

            currentPoem =
                index;


            const modal =
                document.getElementById(
                    "poem-modal"
                );


            const title =
                document.getElementById(
                    "modal-title"
                );


            const lines =
                document.getElementById(
                    "poem-lines"
                );


            const counter =
                document.getElementById(
                    "counter"
                );


            clearLineTimers();


            title.textContent =
                poems[index].title;


            counter.textContent =
                `${index + 1} / ${poems.length}`;


            lines.innerHTML =
                "";


            poems[index].lines.forEach(
                (line, i) => {

                    const p =
                        document.createElement(
                            "div"
                        );


                    p.className =
                        "poem-line";


                    p.textContent =
                        line;


                    lines.appendChild(
                        p
                    );


                    const timer =
                        setTimeout(
                            () => {

                                p.classList.add(
                                    "visible"
                                );

                            },
                            350 + i * 500
                        );


                    lineTimers.push(
                        timer
                    );

                }
            );


            modal.style.display =
                "flex";


            requestAnimationFrame(
                () => {

                    modal.classList.add(
                        "show"
                    );

                }
            );


            createClickPetals(
                window.innerWidth / 2,
                window.innerHeight / 2,
                7
            );
        }


        /* =========================================================
           CLOSE MODAL
        ========================================================= */

        function closeModal() {

            clearLineTimers();


            const modal =
                document.getElementById(
                    "poem-modal"
                );


            modal.classList.remove(
                "show"
            );


            setTimeout(
                () => {

                    modal.style.display =
                        "none";

                },
                400
            );
        }


        /* =========================================================
           NEXT
        ========================================================= */

        function nextPoem() {

            currentPoem++;


            if (
                currentPoem >=
                poems.length
            ) {

                currentPoem = 0;

            }


            createClickPetals(
                window.innerWidth / 2,
                window.innerHeight / 2,
                6
            );


            openPoem(
                currentPoem
            );
        }


        /* =========================================================
           PREVIOUS
        ========================================================= */

        function previousPoem() {

            currentPoem--;


            if (
                currentPoem < 0
            ) {

                currentPoem =
                    poems.length - 1;

            }


            createClickPetals(
                window.innerWidth / 2,
                window.innerHeight / 2,
                6
            );


            openPoem(
                currentPoem
            );
        }


        /* =========================================================
           CLEAR TIMERS
        ========================================================= */

        function clearLineTimers() {

            lineTimers.forEach(
                timer =>
                    clearTimeout(
                        timer
                    )
            );


            lineTimers = [];
        }


        /* =========================================================
           SEARCH
        ========================================================= */

        const search =
            document.getElementById(
                "search"
            );


        search.addEventListener(
            "input",
            function() {

                const query =
                    this.value
                        .toLowerCase()
                        .trim();


                const filtered =
                    poems.filter(
                        poem => {

                            const titleMatch =
                                poem.title
                                    .toLowerCase()
                                    .includes(
                                        query
                                    );


                            const lineMatch =
                                poem.lines.some(
                                    line =>
                                        line
                                            .toLowerCase()
                                            .includes(
                                                query
                                            )
                                );


                            return (
                                titleMatch ||
                                lineMatch
                            );
                        }
                    );


                displayPoems(
                    filtered
                );

            }
        );


        /* =========================================================
           KEYBOARD
        ========================================================= */

        document.addEventListener(
            "keydown",
            function(event) {

                const modal =
                    document.getElementById(
                        "poem-modal"
                    );


                if (
                    modal.style.display !==
                    "flex"
                ) {

                    return;

                }


                if (
                    event.key ===
                    "Escape"
                ) {

                    closeModal();

                }


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    nextPoem();

                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    previousPoem();

                }

            }
        );


        /* =========================================================
           CLICK OUTSIDE MODAL
        ========================================================= */

        document
            .getElementById(
                "poem-modal"
            )
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        this
                    ) {

                        createClickPetals(
                            event.clientX,
                            event.clientY,
                            7
                        );


                        closeModal();

                    }

                }
            );


        /* =========================================================
           NORMAL FALLING PETALS
        ========================================================= */

        function createNormalPetal() {

            const petal =
                document.createElement(
                    "div"
                );


            petal.className =
                "falling-petal";


            const petalTypes = [
                "🌸",
                "🌹",
                "🌷"
            ];


            petal.textContent =
                petalTypes[
                    Math.floor(
                        Math.random() *
                        petalTypes.length
                    )
                ];


            petal.style.left =
                Math.random() *
                100 +
                "vw";


            petal.style.fontSize =
                (
                    10 +
                    Math.random() * 14
                ) +
                "px";


            petal.style.animationDuration =
                (
                    7 +
                    Math.random() * 7
                ) +
                "s";


            document.body.appendChild(
                petal
            );


            setTimeout(
                () => {

                    petal.remove();

                },
                15000
            );
        }


        setInterval(
            createNormalPetal,
            900
        );


        /* =========================================================
           CLICK PETAL BURST
        ========================================================= */

        function createClickPetals(
            x,
            y,
            amount = 8
        ) {

            const petals = [
                "🌸",
                "🌹",
                "🌷",
                "✿",
                "❀"
            ];


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const petal =
                    document.createElement(
                        "div"
                    );


                petal.className =
                    "click-petal";


                petal.textContent =
                    petals[
                        Math.floor(
                            Math.random() *
                            petals.length
                        )
                    ];


                petal.style.left =
                    x +
                    "px";


                petal.style.top =
                    y +
                    "px";


                const randomX =
                    (
                        Math.random() *
                        220
                    ) - 110;


                const randomY =
                    80 +
                    Math.random() *
                    180;


                const rotation =
                    (
                        Math.random() *
                        720
                    ) - 360;


                const scale =
                    0.6 +
                    Math.random() *
                    0.8;


                petal.style.setProperty(
                    "--x",
                    randomX +
                    "px"
                );


                petal.style.setProperty(
                    "--y",
                    randomY +
                    "px"
                );


                petal.style.setProperty(
                    "--rotate",
                    rotation +
                    "deg"
                );


                petal.style.setProperty(
                    "--scale",
                    scale
                );


                petal.style.animationDuration =
                    (
                        1.1 +
                        Math.random() *
                        0.9
                    ) +
                    "s";


                document.body.appendChild(
                    petal
                );


                setTimeout(
                    () => {

                        petal.remove();

                    },
                    2300
                );

            }


            /* Glow ring */

            const ring =
                document.createElement(
                    "div"
                );


            ring.className =
                "click-ring";


            ring.style.left =
                x +
                "px";


            ring.style.top =
                y +
                "px";


            document.body.appendChild(
                ring
            );


            setTimeout(
                () => {

                    ring.remove();

                },
                800
            );

        }


        /* =========================================================
           GLOBAL CLICK EFFECT
        ========================================================= */

        document.addEventListener(
            "click",
            function(event) {

                const clickedCard =
                    event.target.closest(
                        ".poem-card"
                    );


                const clickedButton =
                    event.target.closest(
                        "button"
                    );


                if (
                    clickedCard ||
                    clickedButton
                ) {

                    return;

                }


                createClickPetals(
                    event.clientX,
                    event.clientY,
                    6
                );

            }
        );


        /* =========================================================
           TOUCH SUPPORT
        ========================================================= */

        document.addEventListener(
            "touchstart",
            function(event) {

                if (
                    !event.touches ||
                    !event.touches.length
                ) {

                    return;

                }


                const touch =
                    event.touches[0];


                createClickPetals(
                    touch.clientX,
                    touch.clientY,
                    7
                );

            },
            {
                passive: true
            }
        );


        /* =========================================================
           CUSTOM CURSOR
           
           Smooth mouse-following system.
        ========================================================= */

        const cursorGlow =
            document.getElementById(
                "cursorGlow"
            );


        const cursorDot =
            document.getElementById(
                "cursorDot"
            );


        let mouseX =
            window.innerWidth / 2;


        let mouseY =
            window.innerHeight / 2;


        let glowX =
            mouseX;


        let glowY =
            mouseY;


        let lastParticleTime =
            0;


        let cursorMoving =
            false;


        /* Track mouse */

        document.addEventListener(
            "mousemove",
            function(event) {

                mouseX =
                    event.clientX;

                mouseY =
                    event.clientY;


                cursorDot.style.left =
                    mouseX +
                    "px";


                cursorDot.style.top =
                    mouseY +
                    "px";


                cursorMoving =
                    true;


                const now =
                    Date.now();


                /*
                    Create a tiny trail
                    every few milliseconds.
                */

                if (
                    now -
                    lastParticleTime >
                    45
                ) {

                    createCursorParticle(
                        mouseX,
                        mouseY
                    );


                    lastParticleTime =
                        now;

                }

            }
        );


        /* Smooth cursor animation */

        function animateCursor() {

            glowX +=
                (
                    mouseX -
                    glowX
                ) * 0.16;


            glowY +=
                (
                    mouseY -
                    glowY
                ) * 0.16;


            cursorGlow.style.left =
                glowX +
                "px";


            cursorGlow.style.top =
                glowY +
                "px";


            requestAnimationFrame(
                animateCursor
            );

        }


        animateCursor();


        /* =========================================================
           CURSOR TRAIL PARTICLE
        ========================================================= */

        function createCursorParticle(
            x,
            y
        ) {

            const particle =
                document.createElement(
                    "div"
                );


            particle.className =
                "cursor-particle";


            particle.style.left =
                x +
                "px";


            particle.style.top =
                y +
                "px";


            const size =
                2 +
                Math.random() *
                4;


            particle.style.width =
                size +
                "px";


            particle.style.height =
                size +
                "px";


            document.body.appendChild(
                particle
            );


            setTimeout(
                () => {

                    particle.remove();

                },
                850
            );

        }


        /* =========================================================
           CURSOR PETALS
        ========================================================= */

        function createCursorPetal(
            x,
            y
        ) {

            const petal =
                document.createElement(
                    "div"
                );


            petal.className =
                "cursor-petal";


            const types = [
                "✿",
                "❀",
                "🌸"
            ];


            petal.textContent =
                types[
                    Math.floor(
                        Math.random() *
                        types.length
                    )
                ];


            petal.style.left =
                x +
                "px";


            petal.style.top =
                y +
                "px";


            petal.style.setProperty(
                "--move-x",
                (
                    Math.random() * 35 -
                    17
                ) +
                "px"
            );


            petal.style.setProperty(
                "--move-y",
                (
                    Math.random() * 35 -
                    17
                ) +
                "px"
            );


            petal.style.setProperty(
                "--rotation",
                (
                    Math.random() * 240 -
                    120
                ) +
                "deg"
            );


            document.body.appendChild(
                petal
            );


            setTimeout(
                () => {

                    petal.remove();

                },
                1100
            );

        }


        /* =========================================================
           CREATE CURSOR PETALS OCCASIONALLY
        ========================================================= */

        let cursorPetalCounter =
            0;


        document.addEventListener(
            "mousemove",
            function(event) {

                cursorPetalCounter++;


                /*
                    Every few mouse movements
                    create a tiny flower/petal.
                */

                if (
                    cursorPetalCounter %
                    12 ===
                    0
                ) {

                    createCursorPetal(
                        event.clientX,
                        event.clientY
                    );

                }

            }
        );


        /* =========================================================
           CURSOR HOVER EFFECT
        ========================================================= */

        function enableCursorHover() {

            cursorGlow.classList.add(
                "cursor-hover"
            );

        }


        function disableCursorHover() {

            cursorGlow.classList.remove(
                "cursor-hover"
            );

        }


        /*
            Interactive elements.
        */

        document.addEventListener(
            "mouseover",
            function(event) {

                const interactive =
                    event.target.closest(
                        "button, .poem-card, .made-by, .footer-name, input"
                    );


                if (interactive) {

                    enableCursorHover();

                }

            }
        );


        document.addEventListener(
            "mouseout",
            function(event) {

                const interactive =
                    event.target.closest(
                        "button, .poem-card, .made-by, .footer-name, input"
                    );


                if (
                    interactive &&
                    !interactive.contains(
                        event.relatedTarget
                    )
                ) {

                    disableCursorHover();

                }

            }
        );


        /* =========================================================
           CURSOR CLICK ANIMATION
        ========================================================= */

        document.addEventListener(
            "mousedown",
            function() {

                cursorGlow.classList.add(
                    "cursor-click"
                );

            }
        );


        document.addEventListener(
            "mouseup",
            function() {

                cursorGlow.classList.remove(
                    "cursor-click"
                );

            }
        );


        /* =========================================================
           HOME MOUSE PARALLAX
        ========================================================= */

        document.addEventListener(
            "mousemove",
            function(event) {

                const intro =
                    document.getElementById(
                        "intro"
                    );


                if (
                    intro.style.display ===
                    "none"
                ) {

                    return;

                }


                const x =
                    (
                        event.clientX /
                        window.innerWidth
                    ) - 0.5;


                const y =
                    (
                        event.clientY /
                        window.innerHeight
                    ) - 0.5;


                const orbs =
                    document.querySelectorAll(
                        ".home-orb"
                    );


                orbs.forEach(
                    (orb, index) => {

                        const strength =
                            (
                                index + 1
                            ) * 12;


                        orb.style.transform =
                            `translate(
                                ${x * strength}px,
                                ${y * strength}px
                            )`;

                    }
                );

            }
        );


        /* =========================================================
           SCROLL PARALLAX
        ========================================================= */

        window.addEventListener(
            "scroll",
            function() {

                const roses =
                    document.querySelectorAll(
                        ".home-rose"
                    );


                roses.forEach(
                    (rose, index) => {

                        const speed =
                            (
                                index % 3 +
                                1
                            ) * 0.08;


                        rose.style.transform =
                            `translateY(
                                ${window.scrollY * speed}px
                            )`;

                    }
                );

            }
        );


        /* =========================================================
           INITIALIZE
        ========================================================= */

        displayPoems();

    </script>

</body>

</html>
